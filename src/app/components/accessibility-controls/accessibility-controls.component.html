<div class="accessibility-controls">

  <!-- READ ALOUD -->
  <button
    type="button"
    class="accessibility-button"
    (click)="readPage()"
    aria-label="Read this page aloud">

    <ion-icon name="volume-high-outline"></ion-icon>
    <span>Read Aloud</span>

  </button>


  <!-- STOP -->
  <button
    type="button"
    class="accessibility-button stop-button"
    (click)="stopReading()"
    aria-label="Stop reading">

    <ion-icon name="stop-circle-outline"></ion-icon>
    <span>Stop</span>

  </button>


  <!-- TEXT SIZE -->
  <div class="text-size-control">

    <label for="text-size">
      <ion-icon name="text-outline"></ion-icon>
      Text Size
    </label>

    <input
      id="text-size"
      type="range"
      min="80"
      max="200"
      step="10"
      [(ngModel)]="textSize"
      (input)="changeTextSize()"
      aria-label="Change text size">

    <span class="size-value">
      {{ textSize }}%
    </span>

  </div>


 <!-- RESET ALL ACCESSIBILITY SETTINGS -->
<button
  type="button"
  class="reset-text-button"
  (click)="resetAccessibility()"
  aria-label="Reset all accessibility settings">

  <ion-icon name="refresh-outline"></ion-icon>
  Reset All

</button>


  <!-- HIGH CONTRAST -->
  <button
    type="button"
    class="accessibility-button contrast-button"
    [class.active]="highContrast"
    (click)="toggleHighContrast()"
    [attr.aria-pressed]="highContrast"
    aria-label="Toggle high contrast mode">

    <ion-icon name="contrast-outline"></ion-icon>

    <span>
      {{ highContrast ? 'Normal Contrast' : 'High Contrast' }}
    </span>

  </button>

</div>
